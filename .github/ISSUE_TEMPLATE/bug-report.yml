name: Bug / Defect Report
description: Report incorrect, unexpected, or missing behavior in the Navigator 3 system.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the Navigator 3 system is affected?
      options:
        - Tablet application
        - Wired probe
        - Wireless probe
        - Bluetooth / wireless connectivity
        - Count rate meter / audio feedback
        - System startup / shutdown
        - Multiple components
        - Unknown / other
    validations:
      required: true

  - type: input
    id: sw-version
    attributes:
      label: Software Version
      description: Tablet app → Settings → About → Software Version
      placeholder: "e.g., 3.1.2"
    validations:
      required: true

  - type: input
    id: device-serial
    attributes:
      label: Device Serial Number (optional)
      placeholder: "e.g., NAV3-00042"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Power on the system
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, error messages, test data, or any other relevant information.

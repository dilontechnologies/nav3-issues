name: Documentation Issue
description: Report a problem with product labeling, instructions for use (IFU), or on-screen text.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc-type
    attributes:
      label: Document Type
      description: Which document or text has the issue?
      options:
        - Instructions for Use (IFU)
        - Quick Start Guide
        - On-screen help / tooltips
        - Device labeling
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Document name, section, or screen name where the issue appears.
      placeholder: "e.g., IFU Section 4.2, or Settings screen help text"
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Issue Description
      description: What is incorrect, unclear, or missing?
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: Suggested Correction
      description: What should it say or show instead? (Optional — leave blank if just flagging the issue.)
